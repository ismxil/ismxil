<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opinion | Ismail Ahmad</title>
    <style>
        @font-face {
            font-family: 'Uncut Sans';
            src: url('assets/Uncut Sans/Webfonts/UncutSans-Variable.woff2') format('woff2');
            font-weight: 300 800;
            font-style: normal;
            font-display: swap;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0;
            background: #ffffff;
            color: #111111;
            height: 100%;
        }

        body {
            font-family: 'Uncut Sans', sans-serif;
            font-weight: 700;
            font-size: 14px;
            line-height: 1.7;
            overflow-y: auto;
            overflow-x: hidden;
            border-radius: 20px 20px 0 0;
        }
        body * {
            font-family: 'Uncut Sans', sans-serif !important;
            font-weight: 700 !important;
        }
        button, input, textarea, select, a { font-family: inherit; font-weight: inherit; }

        .handle-bar {
            width: 36px;
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            margin: 12px auto 0;
        }

        .content {
            padding: 24px 28px 48px;
            max-width: 560px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Uncut Sans', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: #111;
            margin: 0 0 24px;
            line-height: 1.2;
        }

        .divider {
            height: 1px;
            background: #ebebeb;
            margin: 0 0 24px;
        }

        .article-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .article-item {
            display: flex;
            gap: 20px;
            padding: 16px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .article-item:last-child { border-bottom: none; }

        .article-year {
            font-family: 'Uncut Sans', sans-serif;
            font-size: 12px;
            color: #aaa;
            width: 36px;
            flex-shrink: 0;
            padding-top: 3px;
        }

        .article-title {
            font-family: 'Uncut Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            color: #111;
            text-decoration: none;
            display: block;
            margin-bottom: 3px;
            line-height: 1.3;
        }
        .article-title:hover { color: #0011FF; }

        .article-desc {
            font-size: 13px;
            color: #888;
            margin: 0;
            line-height: 1.5;
        }

        .article-state {
            color: #888;
            font-size: 13px;
            padding: 16px 0;
        }

        .article-state a {
            color: #0011FF;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="handle-bar"></div>
    <div class="content">

        <h1>Opinion</h1>
        <div class="divider"></div>

        <ul class="article-list" id="article-list">
            <li class="article-state">Fetching latest essays from Substack...</li>
        </ul>

    </div>

    <script src="blog-cache.js"></script>
    <script>
        (function () {
            var list = document.getElementById('article-list');

            function textOnly(value) {
                var div = document.createElement('div');
                div.innerHTML = value || '';
                return (div.textContent || div.innerText || '').trim();
            }

            function renderArticles(articles) {
                if (!articles || !articles.length) {
                    showError();
                    return;
                }

                list.innerHTML = '';
                articles.forEach(function (article) {
                    var item = document.createElement('li');
                    item.className = 'article-item';

                    var year = document.createElement('span');
                    year.className = 'article-year';
                    year.textContent = article.year || (article.pubDate ? new Date(article.pubDate).getFullYear() : '');

                    var body = document.createElement('div');

                    var title = document.createElement('a');
                    title.className = 'article-title';
                    title.href = 'article.html?slug=' + encodeURIComponent(article.slug);
                    title.textContent = article.title;

                    var desc = document.createElement('p');
                    desc.className = 'article-desc';
                    desc.textContent = textOnly(article.description);

                    body.appendChild(title);
                    if (desc.textContent) body.appendChild(desc);
                    item.appendChild(year);
                    item.appendChild(body);
                    list.appendChild(item);
                });
            }

            function showError() {
                list.innerHTML = '<li class="article-state">Could not load Substack right now. <a href="https://wandarer.com" target="_blank" rel="noopener">Open Wandarer</a>.</li>';
            }

            if (!window.BlogCache) {
                showError();
                return;
            }

            BlogCache.getArticles(function (articles) {
                renderArticles(articles);
            });
        })();
    </script>
</body>
</html>
